<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BondScope</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; margin: 0; background: #f0f2f5; }
        #sidebar { width: 280px; background: #1a2a3a; color: white; height: 100vh; padding: 25px; position: fixed; overflow-y: auto; box-sizing: border-box; }
        #main { margin-left: 280px; flex: 1; padding: 40px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; color: #4facfe; }
        label { display: block; margin-top: 15px; font-size: 0.9rem; color: #cbd5e0; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 0; border-radius: 6px; background: #2d3748; color: white; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4facfe; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        button:hover { background: #00c6ff; }
        .tab-btn { width: auto; padding: 10px 20px; margin-right: 10px; background: #718096; margin-top: 0; }
        .tab-btn.active { background: #4facfe; }
        table { width:100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        th { background: #edf2f7; position: sticky; top: 0; }
        #bond-list { max-height: 260px; overflow-y: auto; background: #2d3748; border-radius: 6px; padding: 6px; margin-top: 8px; font-size: 0.82rem; }
        .bond-item { padding: 5px 8px; cursor: pointer; border-radius: 4px; margin: 2px 0; color: #e2e8f0; }
        .bond-item:hover { background: #4a5568; }
        .bond-item.selected { background: #4facfe; color: white; }
        .bond-item .code { font-size: 0.72rem; color: #a0aec0; }
        .bond-item.selected .code { color: #e0f0ff; }
        #selected-label { font-size: 0.82rem; color: #a0aec0; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>BondScope</h1>
        <label>開始日</label><input type="date" id="start" value="2026-04-01">
        <label>終了日</label><input type="date" id="end" value="2026-05-29">

        <div id="jgb-controls">
            <label>表示間隔</label>
            <select id="interval" onchange="renderVisuals()">
                <option value="daily">日次 (全データ)</option>
                <option value="weekly">週次 (週末のみ)</option>
                <option value="monthly">月次 (月末のみ)</option>
            </select>
        </div>

        <div id="tspread-controls" style="display:none">
            <label>銘柄種別</label>
            <select id="bond-type" onchange="loadBondList()">
                <option value="">全種別</option>
                <option value="1">国債</option>
                <option value="2">政府保証債</option>
                <option value="3">地方債</option>
                <option value="4">社債</option>
                <option value="5">金融債</option>
                <option value="6">財投機関債</option>
            </select>
            <label>銘柄検索</label>
            <input type="text" id="bond-search" oninput="filterBondList()" placeholder="銘柄名・コードで検索">
            <div id="bond-list"><div style="color:#718096;padding:4px">種別を選択してください</div></div>
            <div id="selected-label">選択中: 0銘柄</div>
        </div>

        <button onclick="update()">データを更新</button>
    </div>

    <div id="main">
        <div style="margin-bottom: 20px;">
            <button onclick="showView('chart')" id="btn-chart" class="tab-btn active">グラフ表示</button>
            <button onclick="showView('table')" id="btn-table" class="tab-btn">テーブル表示</button>
            <button onclick="showView('tspread')" id="btn-tspread" class="tab-btn">Tスプレッド</button>
        </div>

        <div id="chart-view" class="card">
            <canvas id="yieldChart"></canvas>
        </div>

        <div id="table-view" class="card" style="display:none">
            <div id="table-container" style="overflow-x: auto; max-height: 70vh;"></div>
        </div>

        <div id="tspread-view" class="card" style="display:none">
            <canvas id="tspreadChart"></canvas>
        </div>
    </div>

    <script>
    let chart, tspreadChart;
    let rawData = [];
    let bondData = [];
    let selectedCodes = new Set();
    let activeView = 'chart';

    function showView(view) {
        activeView = view;
        ['chart', 'table', 'tspread'].forEach(v => {
            document.getElementById(v + '-view').style.display = v === view ? 'block' : 'none';
            document.getElementById('btn-' + v).classList.toggle('active', v === view);
        });
        document.getElementById('jgb-controls').style.display = view === 'tspread' ? 'none' : 'block';
        document.getElementById('tspread-controls').style.display = view === 'tspread' ? 'block' : 'none';

        if (view === 'tspread' && bondData.length === 0) {
            loadBondList();
        }
    }

    function update() {
        if (activeView === 'tspread') {
            updateTSpread();
        } else {
            updateChart();
        }
    }

    // --- JGBイールドカーブ ---

    async function updateChart() {
        const s = document.getElementById('start').value;
        const e = document.getElementById('end').value;
        const res = await fetch(`/api/yield?start=${s}&end=${e}`);
        rawData = await res.json();
        if (!rawData || rawData.length === 0) { alert('指定期間のデータが見つかりませんでした。'); return; }
        renderVisuals();
    }

    function renderVisuals() {
        const interval = document.getElementById('interval').value;
        const allDates = [...new Set(rawData.map(d => d.Date.split('T')[0]))].sort();
        let filteredDates = allDates;

        if (interval === 'weekly') {
            filteredDates = allDates.filter((d, i) => {
                if (i === allDates.length - 1) return true;
                return new Date(allDates[i+1]).getDay() <= new Date(d).getDay();
            });
        } else if (interval === 'monthly') {
            filteredDates = allDates.filter((d, i) => {
                if (i === allDates.length - 1) return true;
                return d.split('-')[1] !== allDates[i+1].split('-')[1];
            });
        }

        const displayData = rawData.filter(d => filteredDates.includes(d.Date.split('T')[0]));
        const labels = [...new Set(displayData.map(d => d.Tenor))].sort((a, b) => a - b);
        const dates = [...new Set(displayData.map(d => d.Date.split('T')[0]))];

        const datasets = dates.map((date, i) => {
            const color = `hsl(${(360 / Math.max(dates.length, 1)) * i}, 70%, 50%)`;
            return {
                label: date,
                data: labels.map(t => {
                    const val = displayData.find(d => d.Date.startsWith(date) && d.Tenor === t)?.Value;
                    return val != null ? { x: t, y: val } : null;
                }).filter(v => v !== null),
                borderColor: color, backgroundColor: color, tension: 0.3, borderWidth: 2, pointRadius: 2
            };
        });

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('yieldChart'), {
            type: 'line', data: { datasets },
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } },
                scales: {
                    y: { title: { display: true, text: '利率 (%)' } },
                    x: { type: 'linear', title: { display: true, text: '年限 (Tenor)' }, ticks: { callback: v => v + 'Y' } }
                }
            }
        });

        const container = document.getElementById('table-container');
        let html = '<table><tr><th>基準日</th>';
        labels.forEach(l => html += `<th>${l}Y</th>`);
        html += '</tr>';
        dates.forEach(date => {
            html += `<tr><td><strong>${date}</strong></td>`;
            labels.forEach(t => {
                const val = displayData.find(d => d.Date.startsWith(date) && d.Tenor === t)?.Value;
                html += `<td>${val !== undefined ? val.toFixed(3) : '-'}</td>`;
            });
            html += '</tr>';
        });
        html += '</table>';
        container.innerHTML = html;
    }

    // --- Tスプレッド ---

    async function loadBondList() {
        const typeId = document.getElementById('bond-type').value;
        const url = typeId ? `/api/bonds?type_id=${typeId}` : '/api/bonds';
        const res = await fetch(url);
        bondData = await res.json() || [];
        filterBondList();
    }

    function filterBondList() {
        const q = document.getElementById('bond-search').value.toLowerCase();
        const filtered = bondData.filter(b =>
            !q || (b.BondCode || '').toLowerCase().includes(q) || (b.BondName || '').toLowerCase().includes(q)
        );
        const container = document.getElementById('bond-list');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="color:#718096;padding:4px">該当なし</div>';
            return;
        }
        container.innerHTML = filtered.slice(0, 300).map(b => {
            const sel = selectedCodes.has(b.BondCode);
            return `<div class="bond-item${sel ? ' selected' : ''}" onclick="toggleBond('${b.BondCode}', '${(b.BondName||'').replace(/'/g,"\\'")}')">
                <div class="code">${b.BondCode}</div>${b.BondName}
            </div>`;
        }).join('');
    }

    function toggleBond(code, name) {
        if (selectedCodes.has(code)) {
            selectedCodes.delete(code);
        } else {
            if (selectedCodes.size >= 10) { alert('最大10銘柄まで選択できます'); return; }
            selectedCodes.add(code);
        }
        filterBondList();
        document.getElementById('selected-label').textContent = `選択中: ${selectedCodes.size}銘柄`;
    }

    async function updateTSpread() {
        if (selectedCodes.size === 0) { alert('銘柄を選択してください'); return; }
        const s = document.getElementById('start').value;
        const e = document.getElementById('end').value;
        const codes = [...selectedCodes].join(',');
        const res = await fetch(`/api/tspread?codes=${encodeURIComponent(codes)}&start=${s}&end=${e}`);
        const data = await res.json();
        if (!data || data.length === 0) { alert('指定期間のデータが見つかりませんでした。'); return; }
        renderTSpread(data);
    }

    function renderTSpread(data) {
        const byCode = {};
        data.forEach(d => {
            if (!byCode[d.bond_code]) byCode[d.bond_code] = { name: d.bond_name, points: [] };
            // t_spread は%ポイント → ×100でbp表示
            byCode[d.bond_code].points.push({ x: d.date, y: +(d.t_spread * 100).toFixed(2) });
        });

        const codes = Object.keys(byCode);
        const datasets = codes.map((code, i) => {
            const color = `hsl(${(360 / Math.max(codes.length, 1)) * i}, 70%, 50%)`;
            return {
                label: byCode[code].name,
                data: byCode[code].points,
                borderColor: color, backgroundColor: color,
                tension: 0.2, borderWidth: 2, pointRadius: 2
            };
        });

        if (tspreadChart) tspreadChart.destroy();
        tspreadChart = new Chart(document.getElementById('tspreadChart'), {
            type: 'line', data: { datasets },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } },
                    tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} bp` } }
                },
                scales: {
                    y: { title: { display: true, text: 'Tスプレッド (bp)' } },
                    x: { title: { display: true, text: '日付' } }
                }
            }
        });
    }

    document.getElementById('interval').addEventListener('change', renderVisuals);

    updateChart();
    </script>
</body>
</html>
